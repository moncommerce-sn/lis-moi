<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lis-moi</title>
<meta name="description" content="Prenez un papier en photo, Lis-moi vous l’explique en wolof ou en français.">
<meta name="theme-color" content="#0F5C5A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#EFE9DF; --surface:#FFFFFF; --ink:#1F1A17; --muted:#6B625A; --line:#DDD3C4;
  --brand:#0F5C5A; --brand-ink:#FFFFFF; --accent:#E0A030; --warn:#B3471C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141A1A; --surface:#1F2727; --ink:#ECE7E1; --muted:#A39B92; --line:#2F3A3A;
         --brand:#3FB3A8; --brand-ink:#0E1414; --warn:#F08A5D; color-scheme:dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--brand);color:var(--brand-ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header b{font-size:22px}
.lang{display:flex;border:1.5px solid currentColor;border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:inherit;font:inherit;font-size:14px;font-weight:600;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand)}
main{max-width:560px;margin:0 auto;padding:16px}
.big{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:96px;border-radius:22px;border:0;
  background:var(--accent);color:#1F1A17;font:inherit;font-size:22px;font-weight:700;cursor:pointer;position:relative;margin-bottom:12px}
.big.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);min-height:64px;font-size:18px}
.big svg{width:36px;height:36px}
.big input{position:absolute;inset:0;opacity:0;cursor:pointer}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:4px 0 16px}
#preview{display:none;max-width:100%;max-height:260px;border-radius:14px;margin:0 auto 12px}
.card{background:var(--surface);border-radius:18px;padding:16px;white-space:pre-wrap;margin-bottom:12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--brand);background:none;color:var(--brand);border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.solid{background:var(--brand);color:var(--brand-ink)}
.ask{display:flex;gap:8px;margin-top:8px}
.ask input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;background:var(--surface);color:var(--ink)}
.status{text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.err{color:var(--warn)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
button:focus-visible,input:focus-visible,.big:focus-within{outline:3px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<header>
  <b>Lis-moi</b>
  <div class="lang" role="group" aria-label="Langue">
    <button id="fr" aria-pressed="true">FR</button>
    <button id="wo" aria-pressed="false">Wolof</button>
  </div>
</header>
<main>
  <label class="big" aria-label="Prendre une photo du document">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Prendre une photo</span>
    <input type="file" id="cam" accept="image/*" capture="environment">
  </label>
  <label class="big alt" aria-label="Choisir une photo dans la galerie">
    <span>Choisir dans la galerie</span>
    <input type="file" id="gal" accept="image/*">
  </label>
  <p class="hint">Photographiez le papier bien à plat, avec une bonne lumière.</p>

  <img id="preview" alt="Photo du document">
  <div id="out"></div>
  <p class="status" id="status" aria-live="polite"></p>
  <p class="foot">Lis-moi ne garde pas vos photos. Pour une ordonnance, vérifiez toujours avec votre pharmacien.</p>
</main>

<script>
// ====== À MODIFIER : l'adresse de ton serveur Cloudflare ======
const WORKER_URL = "https://lis-moi.taifmarchand.workers.dev";
// ==============================================================

let lang = "fr", image = null, history = [];
const $ = id => document.getElementById(id);

// Identifiant anonyme de l'appareil (pour compter les documents gratuits)
let deviceId = localStorage.getItem("lm-id");
if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem("lm-id", deviceId); }

function setLang(l){ lang = l; $("fr").setAttribute("aria-pressed", l==="fr"); $("wo").setAttribute("aria-pressed", l==="wo"); }
$("fr").onclick = () => setLang("fr");
$("wo").onclick = () => setLang("wo");

// Réduit la photo (moins de données = moins cher et plus rapide)
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1]; // base64
}

async function onFile(input){
  const f = input.files[0]; input.value = ""; if (!f) return;
  $("out").innerHTML = ""; history = [];
  $("preview").src = URL.createObjectURL(f); $("preview").style.display = "block";
  image = await shrink(f);
  explain(null);
}
$("cam").onchange = () => onFile($("cam"));
$("gal").onchange = () => onFile($("gal"));

async function explain(question){
  $("status").className = "status"; $("status").textContent = "Je lis le document…";
  try{
    const r = await fetch(WORKER_URL + "/explain", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ deviceId, lang, image, question, history })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Erreur");
    if (question) history.push({ role: "user", content: question });
    history.push({ role: "assistant", content: data.text });
    showAnswer(data.text, question);
    $("status").textContent = data.remaining != null ? `Documents gratuits restants ce mois-ci : ${data.remaining}` : "";
  }catch(e){
    $("status").className = "status err";
    $("status").textContent = e.message || "Problème de connexion. Réessayez.";
  }
}

function showAnswer(text, question){
  if (question){ const q = document.createElement("div"); q.className = "card"; q.style.opacity = ".75"; q.textContent = "❓ " + question; $("out").appendChild(q); }
  const card = document.createElement("div"); card.className = "card"; card.textContent = text;
  const row = document.createElement("div"); row.className = "row";
  const listen = document.createElement("button"); listen.className = "btn solid"; listen.textContent = "🔊 Écouter";
  listen.onclick = () => { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/[📄🗣️✅⚠️]/gu, "")); u.lang = "fr-FR"; speechSynthesis.speak(u); };
  row.appendChild(listen); card.appendChild(row);
  $("out").appendChild(card);
  if (!document.querySelector(".ask")){
    const ask = document.createElement("div"); ask.className = "ask";
    ask.innerHTML = '<input id="q" placeholder="Une question sur ce papier ?" aria-label="Question"><button class="btn solid" id="qs">Envoyer</button>';
    $("out").after(ask);
    $("qs").onclick = () => { const v = $("q").value.trim(); if (v && image){ $("q").value = ""; explain(v); } };
  }
  card.scrollIntoView({ behavior: "smooth", block: "start" });
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
